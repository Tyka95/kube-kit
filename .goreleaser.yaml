# goreleaser config for kubekit.
# Builds darwin/linux amd64+arm64 binaries, publishes a GitHub release,
# and updates the Homebrew tap formula at Tyka95/homebrew-kube-kit.

version: 2

project_name: kubekit

before:
  hooks:
    - go mod tidy

builds:
  - id: kubekit
    main: ./cmd/kubekit
    binary: kubekit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: kubekit
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format: tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request

brews:
  - name: kubekit
    # Write the formula to Formula/kubekit.rb, the conventional Homebrew
    # tap layout. Homebrew prefers Formula/ over the repo root when both
    # exist, so writing here keeps a single canonical location and stops
    # silent drift between root and Formula/.
    directory: Formula
    repository:
      owner: Tyka95
      name: homebrew-kube-kit
      branch: main
      # GITHUB_TOKEN can only push to this repo. The tap lives in a
      # separate repo, so route the brew commit through a PAT with
      # contents:write on Tyka95/homebrew-kube-kit.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Tyka95/kube-kit
    description: Terminal UI for Kubernetes and AWS workflows.
    license: MIT
    install: |
      bin.install "kubekit"
    test: |
      system "#{bin}/kubekit", "--version"
    dependencies:
      - name: kubectl
      - name: awscli

release:
  github:
    owner: Tyka95
    name: kube-kit
  # GitHub's immutable-releases feature blocks asset uploads after a
  # release is published. Goreleaser creates the release first and then
  # uploads — which fails with 422 "Cannot upload assets to an immutable
  # release". Drafts remain mutable, so we create the release as a draft
  # here and the workflow flips it to published once uploads finish.
  draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"
